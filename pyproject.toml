[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoai-rabat"
version = "0.1.0"
description = "Pipeline GeoAI cloud-native pour la cartographie thermique urbaine de Rabat"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "pillow>=10,<13",
]

[project.optional-dependencies]
geo = [
  "geopandas>=0.14,<2",
  "pyproj>=3.6,<4",
  "rasterio>=1.3,<2",
  "shapely>=2,<3",
]
boosting = ["xgboost>=2,<4"]
parquet = ["fastparquet>=2024.5"]
real-data = [
  "planetary-computer>=1,<2",
  "pyproj>=3.6,<4",
  "pystac-client>=0.8,<1",
  "rasterio>=1.4,<2",
  "reportlab>=4,<5",
  "requests>=2.28,<3",
  "shapely>=2,<3",
  "xgboost>=2,<4",
  "pypdf>=4,<7",
]
ml-standard = [
  "joblib>=1.3,<2",
  "matplotlib>=3.8,<4",
  "pyarrow>=15,<22",
  "scikit-learn>=1.4,<2",
]
dev = ["pytest>=8,<9", "ruff>=0.5,<1"]
tracking = ["mlflow>=2.14,<4"]

[project.scripts]
geoai-rabat = "geoai_rabat.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: vérifie les données et artefacts complets générés localement",
]

[tool.ruff]
line-length = 100
target-version = "py310"
